version: "3.9"

services:

  api:
    image: mithileshkrsinghniitians/cwp-api:latest
    ports:
      - "8083:8000"
    restart: always

  dashboard:
    image: mithileshkrsinghniitians/cwp-dashboard:latest
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: always